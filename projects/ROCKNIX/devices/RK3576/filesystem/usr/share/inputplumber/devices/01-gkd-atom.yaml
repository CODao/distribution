# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1

kind: CompositeDevice

name: GameKiddy GKD Atom

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: GameKiddy GKD Atom

maximum_sources: 2

source_devices:
  - group: gamepad
    evdev:
      name: gamepad-keys
      handler: event*
    capability_map_id: gkd_atom_map
  - group: gamepad
    evdev:
      name: adc-joystick
      handler: event*
    capability_map_id: gkd_atom_map

options:
  auto_manage: true

target_devices:
  - ds5
  - keyboard
